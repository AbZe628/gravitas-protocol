# Publishes apps/web to GitHub Pages.
#
# This workflow did not previously exist, although the README described it. The
# live site was therefore served from the committed apps/web/dist/ build output,
# which meant edits to source never reached production on their own. See
# DEPLOY.md section 8.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Keep the custom domain
        run: cp CNAME apps/web/dist/public/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
