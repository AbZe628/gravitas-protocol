# Publishes the site to GitHub Pages.
#
# The artifact carries two things:
#   /        the static marketing site from site/
#   /app/    the React application built from apps/web/
#
# They are separate on purpose. The marketing page is one HTML file with no build
# step, and the application keeps its own routes underneath /app/. The root
# 404.html forwards the old root paths (/dashboard and friends) to their new
# home, and restores client-side routes for /app/*, which is what GitHub Pages
# cannot do on its own.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/web/**'
      - 'CNAME'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the application
        working-directory: apps/web
        # npm install, not npm ci, and that is a known defect rather than a
        # preference. On Linux the lockfile resolves three packages it does not
        # contain - @base-org/account, brotli-wasm and clsx - so npm ci refuses
        # to start. None of them appear when the lockfile is regenerated on
        # Windows, which is where it was last written.
        #
        # Until the lockfile is regenerated on Linux, production builds from an
        # unpinned graph. See docs/KNOWN-ISSUES.md.
        run: npm install

      - name: Build the application
        working-directory: apps/web
        run: npm run build

      - name: Assemble the artifact
        run: |
          mkdir -p _pages
          cp -r site/. _pages/
          mkdir -p _pages/app
          cp -r apps/web/dist/public/. _pages/app/
          cp CNAME _pages/CNAME
          echo "--- artifact root ---"
          ls -la _pages
          echo "--- application ---"
          ls -la _pages/app | head -20

      - name: Check the pieces are all there
        run: |
          test -f _pages/index.html      || { echo "the marketing page is missing"; exit 1; }
          test -f _pages/404.html        || { echo "the root 404 is missing"; exit 1; }
          test -f _pages/CNAME           || { echo "the custom domain is missing"; exit 1; }
          test -f _pages/assets/hero-scrub.mp4 || { echo "the hero video is missing"; exit 1; }
          test -f _pages/favicon.ico     || { echo "the favicon is missing from the artifact root"; exit 1; }
          test -f _pages/app/index.html  || { echo "the application build is missing"; exit 1; }
          grep -q 'href="/app/dashboard"' _pages/index.html || { echo "the marketing page does not point at the application"; exit 1; }
          grep -q '/app/assets/' _pages/app/index.html || { echo "the application was built for the wrong base path"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
