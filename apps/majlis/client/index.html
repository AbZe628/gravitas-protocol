<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The vellum the application is actually painted on. -->
    <meta name="theme-color" content="#FBF8F1" />
    <!--
      No fonts from anybody else's server.

      Seven families came from Google here, on a stylesheet that held up the
      first paint until Google answered and told it each time the record was

      nastaliq ship with the application — see src/design/tokens.css.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Gravitas Majlis</title>
    <meta
      name="description"
      content="A governance and comprehension environment for Shariah boards supervising on-chain policy."
    />
    <!--
      A board's matters and the questions it asks disclose the direction of its
      deliberation before it has decided anything. The application sits behind a
      credential, but a crawler should be told plainly as well.
    -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body data-app="majlis">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
