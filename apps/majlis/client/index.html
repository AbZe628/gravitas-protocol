<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The vellum the application is actually painted on. -->
    <meta name="theme-color" content="#FBF8F1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Four families for the Latin interface and three for the scripts it is
      read in.

      `tokens.css` has named Amiri, Noto Naskh Arabic and Noto Nastaliq Urdu
      since the palette was written and none of them were ever fetched, so
      Arabic rendered in whatever the machine happened to have and Urdu — which
      needs nastaliq, not a naskh and certainly not a sans — rendered in
      something no Urdu reader would choose.

      The browser downloads a face only when a glyph needs it, so an English
      session pays for the stylesheet and none of the files.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Gravitas Majlis</title>
    <meta
      name="description"
      content="A governance and comprehension environment for Shariah boards supervising on-chain policy."
    />
    <!--
      A board's matters and the questions it asks disclose the direction of its
      deliberation before it has decided anything. The application sits behind a
      credential, but a crawler should be told plainly as well.
    -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body data-app="majlis">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
