# Render blueprint for Majlis.
#
# Single instance, deliberately. The rate limiter and the daily spend cap in
# apps/majlis/server/src/services/limits.ts are in-process: two instances keep
# two independent counters and the effective cap doubles, silently. Do not add
# autoscaling without first moving those counters to a shared store.
#
# Secrets are marked sync:false so Render prompts for them rather than reading
# them from this file. Nothing secret belongs in a public repository.
services:
  - type: web
    name: gravitas-majlis
    runtime: node
    plan: starter            # not "free": cold starts make a poor first impression
    region: frankfurt
    branch: main
    rootDir: apps/majlis
    numInstances: 1          # see the note above before changing this
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # --- secrets: entered in the Render dashboard, never committed --------
      - key: ANTHROPIC_API_KEY
        sync: false
      # One credential per member, so a vote can be attributed. Without it the
      # shared credential below authenticates as an observer, which reads and
      # writes nothing. Generate entries with: npm run member -w server
      - key: MAJLIS_MEMBERS
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false

      # --- the record -------------------------------------------------------
      # Stage Two writes. Render's filesystem is ephemeral unless a disk is
      # mounted, and none is: every decision the board takes is discarded on the
      # next deploy. The application says so rather than hiding it — the record
      # carries the date it began and the Record page states that it is not
      # durable.
      #
      # This path must be one the process can create. It is not root, so a path
      # under /var fails at boot with ENOENT unless a disk is mounted there —
      # which is what the earlier value assumed and did not have.
      #
      # To keep the record, add a disk (a paid change) and set both together:
      #   disk:
      #     name: majlis-data
      #     mountPath: /var/majlis
      #     sizeGB: 1
      # then MAJLIS_DB: /var/majlis/majlis.json
      - key: MAJLIS_DB
        value: /tmp/majlis.json

      # --- limits: the only thing between an open endpoint and the budget ---
      - key: RATE_LIMIT_PER_IP
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_GLOBAL_PER_DAY
        value: 2000
      - key: ASSISTANT_DAILY_USD_CAP
        value: 5
      - key: ASSISTANT_USD_PER_QUESTION
        value: 0.02

      # --- chain ------------------------------------------------------------
      - key: RPC_URL
        value: https://sepolia-rollup.arbitrum.io/rpc
      # Redeployed and verified on Arbiscan, 23 August 2026. The bytecode at
      # these addresses is built from the source in this repository.
      - key: POLICY_REGISTRY_ADDRESS
        value: "0x6f3bfb896DD9964C9c05dA88692bDf1b1b2C3F23"
      - key: TELEPORT_V3_ADDRESS
        value: "0x6702C2CE6eD58ca3934eBBd785CaC1De8DCd85B4"
